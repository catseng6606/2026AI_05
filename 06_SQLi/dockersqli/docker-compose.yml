services:
  php:
    build: .
    container_name: sqli_php
    ports:
      - "8080:80"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sqli_net

  mysql:
    image: mysql:8.4
    container_name: sqli_mysql
    env_file: .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sqli_net

  adminer:
    image: adminer:latest
    container_name: sqli_adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - sqli_net

networks:
  sqli_net:
    driver: bridge

volumes:
  mysql_data:
